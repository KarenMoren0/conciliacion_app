<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">

            <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">

            <h2>Crear cuenta</h2>
            <h1>Ingrese sus datos para registrarse</h1>
            
            {% if mensaje %}
                <div class="alerta">
                    {{ mensaje }}
                </div>
            {% endif %}

            <form method="POST" action="/registro">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Su nombre" required>

                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@davivienda.com" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="********" required>

                <button type="submit">Registrarse</button>
            </form>

            <p>¿Ya tiene cuenta? <a href="/login">Iniciar sesión</a></p>

        </div>
    </div>
</body>
</html>
