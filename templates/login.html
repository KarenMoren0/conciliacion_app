<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

{% if mensaje %}
<div id="toast" class="toast error">
    {{ mensaje }}
</div>
{% endif %}

<div class="login-container">
    <div class="login-box">

        <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">

        <h1>Monitor de Procesos Contables</h1>
        <p>Ingrese sus credenciales para continuar</p>

        <form method="POST" action="/login">
            
            <label for="correo">Correo:</label>
            <input 
            type="email" 
            id="correo" 
            name="correo" 
            placeholder="ejemplo@davivienda.com"
            autocomplete="email"
            required
        >

            <label for="password">Contraseña:</label>

            <div class="password-container">
                <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="********"
                autocomplete="current-password"
                required
            >

            <span class="toggle-password" onclick="mostrarPassword()">
            <i class="fa-solid fa-eye-slash"></i>
            </span>
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <p><a href="/recuperar">¿Olvidó su contraseña?</a></p>
        <p>¿No tiene cuenta? <a href="/registro">Regístrese ahora</a></p>

    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
